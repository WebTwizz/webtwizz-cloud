name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  fixture:
    name: next build with the packed package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack
      - working-directory: test/fixture
        run: npm install --no-audit --no-fund ../../webtwizz-cloud-*.tgz
      - working-directory: test/fixture
        run: npx next build

  integration:
    name: against a throwaway project
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    concurrency:
      group: integration
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build && npm pack
      - working-directory: test/fixture
        run: npm install --no-audit --no-fund ../../webtwizz-cloud-*.tgz && npx next build
      - run: npx vitest run --config vitest.integration.config.ts
        env:
          NEON_API_KEY: ${{ secrets.NEON_API_KEY }}
